name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,loaders]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Build index and run the benchmark
        run: |
          python -m cite ingest --corpus data/corpus --out data/index.json
          python -m cite eval --out eval/results.md
          cat eval/results.md
      - name: Full rebuild vs incremental ingestion
        run: |
          python scripts/benchmark_ingest.py --iterations 5 --scale 10 --scale-iterations 2 --out eval/ingest-benchmark.md
          cat eval/ingest-benchmark.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
