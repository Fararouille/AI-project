[project]
name = "cite"
version = "0.1.0"
description = "Grounded question answering over your documents, with a built-in retrieval evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Youssef Elgharib" }]
keywords = ["rag", "retrieval", "evaluation", "llm", "bm25", "hybrid-search"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
loaders = ["pypdf>=4.0", "beautifulsoup4>=4.12"]
ocr = ["pymupdf>=1.24", "pytesseract>=0.3.10", "Pillow>=10.0"]

[project.scripts]
cite = "cite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]
